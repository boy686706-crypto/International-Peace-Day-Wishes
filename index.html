<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy International Day of Peace</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e88e5,#43a047);
color:white;
text-align:center;
}

.container{
padding:30px;
max-width:600px;
margin:auto;
}

h1{
font-size:40px;
}

  input{
width:90%;
padding:15px;
font-size:20px;
border-radius:10px;
border:none;
margin-top:20px;
}

button{
margin-top:20px;
padding:15px 35px;
font-size:22px;
border:none;
border-radius:30px;
background:#ff9800;
color:white;
cursor:pointer;
}

button:hover{
background:#f57c00;
}

#wish{
display:none;
margin-top:30px;
font-size:24px;
background:white;
color:#333;
padding:20px;
border-radius:15px;
}

.share{
margin-top:30px;
}

.share a{
display:inline-block;
padding:12px 25px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:25px;
font-size:20px;
}

.footer{
margin-top:40px;
font-size:16px;
opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

<h1>🕊 Happy International Day of Peace</h1>

<p>May peace, happiness and success always stay with you.</p>

<input
type="text"
id="name"
placeholder="Enter Your Name">

<br>

<button onclick="wish()">🎁 Show My Wishes</button>

<div id="wish"></div>

<!-- Adsterra Banner -->
<div style="margin-top:25px;">

</div>

<div class="share">

<a id="wa" target="_blank">
Share on WhatsApp
</a>

</div>

<!-- Adsterra Social Bar -->
<div style="margin-top:30px;">
<script src="https://pl30721427.effectivecpmnetwork.com/dd/e7/2e/dde72e7baa830116a820245539db3164.js"></script>

</div>

<div class="footer">

Made with ❤️

Happy International Day of Peace

</div>

</div>

<script>

function wish(){

var n=document.getElementById("name").value;

if(n==""){
alert("Please enter your name.");
return;
}

document.getElementById("wish").style.display="block";

document.getElementById("wish").innerHTML=

"<h2>🌸 Dear "+n+"</h2>"+

"<p>🕊 Wishing you a joyful International Day of Peace!</p>"+

"<p>❤️ May your life be filled with Love.</p>"+

"<p>😊 Happiness.</p>"+

"<p>🌈 Hope.</p>"+

"<p>🤝 Friendship.</p>"+

"<p>☮ Peace.</p>"+

"<h3>Have a wonderful day!</h3>";

var text="Happy International Day of Peace! Visit this page and get your personalized wishes.";

document.getElementById("wa").href="https://wa.me/?text="+encodeURIComponent(text+" "+window.location.href);

}

</script>
<script src="https://pl30721426.effectivecpmnetwork.com/44/f9/58/44f9583fcc10d39ba2841e7cf2eda7ba.js"></script>

</body>
</html>
